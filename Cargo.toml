[package]
name = "ch-proto"
version = "0.1.0"
edition = "2021"

[features]
integration = []

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "varint"
harness = false

[[bench]]
name = "hello"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "column"
harness = false

# Differential-testing wrapper: reads a .sql file, prints TSV result rows.
# See tests/differential/ and DESIGN.md.
[[bin]]
name = "ch-tsv"
path = "src/bin/ch-tsv.rs"

[dependencies]
uuid = { version = "1.23.1", features = ["v4"] }
hostname = "0.4"
# Pure Rust LZ4 — block format (matches ClickHouse compression frame).
lz4_flex = "0.13"
# zstd binding. ClickHouse's compression frame for ZSTD is a raw zstd
# single-frame stream.
zstd = "0.13"
# ClickHouse uses CityHash v1.0.2 (NOT modern Google CityHash). This crate
# is the established Rust binding from the clickhouse-rs ecosystem.
clickhouse-rs-cityhash-sys = "0.1"
